<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIJbookmarks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      /* Apple HIG System Colors (Light Mode) - https://developer.apple.com/design/human-interface-guidelines/color */
      --apple-blue: #007AFF;
      --apple-blue-hover: #0062CC;
      --apple-purple: #AF52DE;
      --apple-pink: #FF2D55;
      --apple-red: #FF3B30;
      --apple-red-hover: #D7261E;
      --apple-orange: #FF9500;
      --apple-yellow: #FFCC00;
      --apple-green: #34C759;
      --apple-mint: #00C7BE;
      --apple-teal: #30B0C7;
      --apple-cyan: #32ADE6;
      --apple-indigo: #5856D6;

      --apple-gray: #8E8E93;
      --apple-gray-2: #AEAEB2;
      --apple-gray-3: #C7C7CC;
      --apple-gray-4: #D1D1D6;
      --apple-gray-5: #E5E5EA;
      --apple-gray-6: #F2F2F7;

      /* Apple HIG Semantic Tokens (Light Mode) */
      --bg-primary: #FFFFFF;
      --bg-secondary: #F2F2F7;
      --bg-tertiary: #FFFFFF;
      --bg-grouped: #F2F2F7;
      --bg-card: #FFFFFF;

      --text-primary: #000000;
      --text-secondary: rgba(60, 60, 67, 0.60);
      --text-tertiary: rgba(60, 60, 67, 0.30);
      --text-quaternary: rgba(60, 60, 67, 0.18);

      --separator: rgba(60, 60, 67, 0.29);
      --separator-opaque: #C6C6C8;

      --fill-primary: rgba(120, 120, 128, 0.20);
      --fill-secondary: rgba(120, 120, 128, 0.16);
      --fill-tertiary: rgba(118, 118, 128, 0.12);
      --fill-quaternary: rgba(116, 116, 128, 0.08);

      --accent: var(--apple-blue);
      --accent-hover: var(--apple-blue-hover);
      --danger: var(--apple-red);
      --danger-hover: var(--apple-red-hover);

      --tint-blue-bg: rgba(0, 122, 255, 0.12);
      --tint-blue-border: rgba(0, 122, 255, 0.30);
      --tint-blue-text: #007AFF;

      --tint-green-bg: rgba(52, 199, 89, 0.12);
      --tint-green-border: rgba(52, 199, 89, 0.30);
      --tint-green-text: #34C759;

      --tint-orange-bg: rgba(255, 149, 0, 0.12);
      --tint-orange-border: rgba(255, 149, 0, 0.30);
      --tint-orange-text: #FF9500;

      --tint-red-bg: rgba(255, 59, 48, 0.12);
      --tint-red-border: rgba(255, 59, 48, 0.30);
      --tint-red-text: #FF3B30;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        /* Apple HIG System Colors (Dark Mode) - https://developer.apple.com/design/human-interface-guidelines/color */
        --apple-blue: #0A84FF;
        --apple-blue-hover: #409CFF;
        --apple-purple: #BF5AF2;
        --apple-pink: #FF375F;
        --apple-red: #FF453A;
        --apple-red-hover: #FF6961;
        --apple-orange: #FF9F0A;
        --apple-yellow: #FFD60A;
        --apple-green: #30D158;
        --apple-mint: #63E6E2;
        --apple-teal: #40C8E0;
        --apple-cyan: #64D2FF;
        --apple-indigo: #5E5CE6;

        --apple-gray: #8E8E93;
        --apple-gray-2: #636366;
        --apple-gray-3: #48484A;
        --apple-gray-4: #3A3A3C;
        --apple-gray-5: #2C2C2E;
        --apple-gray-6: #1C1C1E;

        /* Apple HIG Semantic Tokens (Dark Mode) */
        --bg-primary: #000000;
        --bg-secondary: #1C1C1E;
        --bg-tertiary: #2C2C2E;
        --bg-grouped: #000000;
        --bg-card: #1C1C1E;

        --text-primary: #FFFFFF;
        --text-secondary: rgba(235, 235, 245, 0.60);
        --text-tertiary: rgba(235, 235, 245, 0.30);
        --text-quaternary: rgba(235, 235, 245, 0.16);

        --separator: rgba(84, 84, 88, 0.60);
        --separator-opaque: #38383A;

        --fill-primary: rgba(120, 120, 128, 0.36);
        --fill-secondary: rgba(120, 120, 128, 0.32);
        --fill-tertiary: rgba(118, 118, 128, 0.24);
        --fill-quaternary: rgba(118, 118, 128, 0.18);

        --accent: var(--apple-blue);
        --accent-hover: var(--apple-blue-hover);
        --danger: var(--apple-red);
        --danger-hover: var(--apple-red-hover);

        --tint-blue-bg: rgba(10, 132, 255, 0.15);
        --tint-blue-border: rgba(10, 132, 255, 0.35);
        --tint-blue-text: #0A84FF;

        --tint-green-bg: rgba(48, 209, 88, 0.15);
        --tint-green-border: rgba(48, 209, 88, 0.35);
        --tint-green-text: #30D158;

        --tint-orange-bg: rgba(255, 159, 10, 0.15);
        --tint-orange-border: rgba(255, 159, 10, 0.35);
        --tint-orange-text: #FF9F0A;

        --tint-red-bg: rgba(255, 69, 58, 0.15);
        --tint-red-border: rgba(255, 69, 58, 0.35);
        --tint-red-text: #FF453A;
      }
    }

    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Outfit', 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      color: var(--text-primary);
      background: var(--bg-card);
    }

    /* Premium Header */
    .header {
      padding: 20px 16px 14px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .header-icon {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }

    .header-icon img {
      width: 36px;
      height: 36px;
      object-fit: cover;
      display: block;
    }

    .header-text h1 {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.2px;
    }

    .header-text p {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 1px;
    }

    /* Options Section with Switches */
    .options-section {
      padding: 6px 0;
      border-bottom: 1px solid var(--separator);
    }

    .option-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .option-row:hover {
      background: var(--fill-tertiary);
    }

    .option-label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
    }

    .toggle {
      position: relative;
      width: 36px;
      height: 20px;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--apple-gray-4);
      border-radius: 10px;
      transition: background-color 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .toggle-slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 2px;
      bottom: 2px;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
      transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .toggle input:checked + .toggle-slider {
      background: var(--apple-green);
    }

    .toggle input:checked + .toggle-slider:before {
      transform: translateX(16px);
    }

    /* Pill Buttons */
    .actions {
      padding: 16px;
      display: flex;
      gap: 12px;
    }

    .btn {
      flex: 1;
      padding: 10px 24px;
      border-radius: 24px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
      border: none;
      font-family: inherit;
    }

    .btn:active:not(:disabled) {
      transform: scale(0.97);
    }

    .btn-primary {
      background: var(--accent);
      color: #ffffff;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
      box-shadow: 0 2px 4px var(--tint-blue-border);
    }

    .btn-primary:disabled {
      background: var(--fill-quaternary);
      color: var(--text-tertiary);
      cursor: not-allowed;
    }

    .btn-secondary {
      background: var(--fill-quaternary);
      color: var(--accent);
      border: 1px solid var(--separator-opaque);
    }

    .btn-secondary:hover {
      background: var(--fill-tertiary);
    }

    /* Status Section */
    .status-section {
      padding: 0 16px 16px;
    }

    .status {
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-icon {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
    }

    .status.loading {
      background: var(--tint-blue-bg);
      color: var(--tint-blue-text);
      border: 1px solid var(--tint-blue-border);
    }

    .status.loading .status-icon {
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .status.success {
      background: var(--tint-green-bg);
      color: var(--tint-green-text);
      border: 1px solid var(--tint-green-border);
    }

    .status.error {
      background: var(--tint-red-bg);
      color: var(--tint-red-text);
      border: 1px solid var(--tint-red-border);
    }

    .status.warning {
      background: var(--tint-orange-bg);
      color: var(--tint-orange-text);
      border: 1px solid var(--tint-orange-border);
    }

    /* Results Panels */
    .results-section {
      display: none;
      border-top: 1px solid var(--separator);
      background: var(--bg-grouped);
    }

    .results-section.visible {
      display: block;
    }

    .result-item {
      padding: 14px 16px;
      border-bottom: 1px solid var(--separator);
    }

    .result-item:last-child {
      border-bottom: none;
    }

    .result-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 6px;
    }

    .result-value {
      font-size: 13px;
      color: var(--text-primary);
      line-height: 1.4;
    }

    .result-value.path {
      font-family: -apple-system-ui-monospace, 'SF Mono', Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      background: var(--tint-blue-bg);
      color: var(--tint-blue-text);
      padding: 4px 10px;
      border-radius: 12px;
      display: inline-block;
      border: 1px solid var(--tint-blue-border);
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }

    .tag {
      background: var(--fill-tertiary);
      color: var(--text-secondary);
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 500;
    }

    .integration-status {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .integration-status .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .integration-status .dot.success {
      background: var(--apple-green);
    }

    .integration-status .dot.error {
      background: var(--apple-red);
    }

    /* Pipe-less Modern Navigation Footer */
    .footer {
      padding: 12px 16px;
      border-top: 1px solid var(--separator);
      display: flex;
      justify-content: space-around;
      background: var(--bg-grouped);
      align-items: center;
    }

    .footer a {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      transition: color 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .footer a:hover {
      color: var(--accent);
    }

    .settings-cog {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      transition: background-color 0.15s;
    }

    .settings-cog:hover {
      background-color: var(--fill-tertiary);
    }

    .cog-icon {
      width: 18px;
      height: 18px;
      fill: var(--text-secondary);
      transition: fill 0.15s, transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .settings-cog:hover .cog-icon {
      fill: var(--accent);
      transform: rotate(45deg);
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="header-icon">
      <img src="icons/icon48.png" alt="AIJbookmarks">
    </div>
    <div class="header-text">
      <h1>AIJbookmarks</h1>
      <p>AI-powered bookmark organizer</p>
    </div>
  </div>

  <!-- Options List with Material Switches -->
  <div class="options-section">
    <label class="option-row" for="autoBookmark">
      <span class="option-label">Auto-save to bookmarks</span>
      <div class="toggle">
        <input type="checkbox" id="autoBookmark" checked>
        <span class="toggle-slider"></span>
      </div>
    </label>
    <label class="option-row" id="saveToInstapaperRow" for="saveToInstapaper">
      <span class="option-label">Save to Instapaper (if article)</span>
      <div class="toggle">
        <input type="checkbox" id="saveToInstapaper">
        <span class="toggle-slider"></span>
      </div>
    </label>
    <label class="option-row" id="createTodoistRow" for="createTodoist">
      <span class="option-label">Create Todoist task</span>
      <div class="toggle">
        <input type="checkbox" id="createTodoist">
        <span class="toggle-slider"></span>
      </div>
    </label>
    <label class="option-row" id="createThingsRow" for="createThings">
      <span class="option-label">Add to Things</span>
      <div class="toggle">
        <input type="checkbox" id="createThings">
        <span class="toggle-slider"></span>
      </div>
    </label>
    <label class="option-row" id="saveToReadwiseRow" for="saveToReadwise">
      <span class="option-label">Save to Readwise</span>
      <div class="toggle">
        <input type="checkbox" id="saveToReadwise">
        <span class="toggle-slider"></span>
      </div>
    </label>
    <label class="option-row" id="saveToRaindropRow" for="saveToRaindrop">
      <span class="option-label">Save to Raindrop.io</span>
      <div class="toggle">
        <input type="checkbox" id="saveToRaindrop">
        <span class="toggle-slider"></span>
      </div>
    </label>
  </div>

  <!-- Action Buttons -->
  <div class="actions">
    <button class="btn btn-primary" id="analyzeBtn">Analyze & Save</button>
  </div>

  <!-- Status Alert Area -->
  <div class="status-section" id="statusContainer"></div>

  <!-- AI Results Card -->
  <div class="results-section" id="results">
    <div class="result-item" id="matchedCategoryContainer">
      <div class="result-label">Saved to</div>
      <div class="result-value path" id="matchedCategory"></div>
    </div>

    <div class="result-item">
      <div class="result-label">Title</div>
      <div class="result-value" id="resultTitle"></div>
    </div>

    <div class="result-item">
      <div class="result-label">Summary</div>
      <div class="result-value" id="resultSummary"></div>
    </div>

    <div class="result-item">
      <div class="result-label">Type</div>
      <div class="result-value" id="contentType"></div>
    </div>

    <div class="result-item" id="categoriesContainer">
      <div class="result-label">Tags</div>
      <div class="tags" id="categories"></div>
    </div>

    <div class="result-item" id="instapaperContainer" style="display: none;">
      <div class="result-label">Instapaper</div>
      <div class="result-value integration-status" id="instapaperStatus"></div>
    </div>

    <div class="result-item" id="todoistContainer" style="display: none;">
      <div class="result-label">Todoist</div>
      <div class="result-value integration-status" id="todoistStatus"></div>
    </div>

    <div class="result-item" id="thingsContainer" style="display: none;">
      <div class="result-label">Things</div>
      <div class="result-value integration-status" id="thingsStatus"></div>
    </div>

    <div class="result-item" id="readwiseContainer" style="display: none;">
      <div class="result-label">Readwise</div>
      <div class="result-value integration-status" id="readwiseStatus"></div>
    </div>

    <div class="result-item" id="raindropContainer" style="display: none;">
      <div class="result-label">Raindrop.io</div>
      <div class="result-value integration-status" id="raindropStatus"></div>
    </div>
  </div>

  <!-- Nav Footer Bar (Pipe-less) -->
  <div class="footer">
    <a href="#" id="inboxLink">To Sort</a>
    <a href="#" id="healthCheckLink">Health Check</a>
    <a href="#" id="settingsLink" class="settings-cog" title="Settings">
      <svg class="cog-icon" viewBox="0 0 24 24">
        <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
      </svg>
    </a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
