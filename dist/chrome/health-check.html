<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookmark Health Check – AIJbookmarks</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      /* Apple HIG System Colors (Light Mode) - https://developer.apple.com/design/human-interface-guidelines/color */
      --apple-blue: #007AFF;
      --apple-blue-hover: #0062CC;
      --apple-purple: #AF52DE;
      --apple-pink: #FF2D55;
      --apple-red: #FF3B30;
      --apple-red-hover: #D7261E;
      --apple-orange: #FF9500;
      --apple-yellow: #FFCC00;
      --apple-green: #34C759;
      --apple-mint: #00C7BE;
      --apple-teal: #30B0C7;
      --apple-cyan: #32ADE6;
      --apple-indigo: #5856D6;

      --apple-gray: #8E8E93;
      --apple-gray-2: #AEAEB2;
      --apple-gray-3: #C7C7CC;
      --apple-gray-4: #D1D1D6;
      --apple-gray-5: #E5E5EA;
      --apple-gray-6: #F2F2F7;

      /* Apple HIG Semantic Tokens (Light Mode) */
      --bg-primary: #FFFFFF;
      --bg-secondary: #F2F2F7;
      --bg-tertiary: #FFFFFF;
      --bg-grouped: #F2F2F7;
      --bg-card: #FFFFFF;

      --text-primary: #000000;
      --text-secondary: rgba(60, 60, 67, 0.60);
      --text-tertiary: rgba(60, 60, 67, 0.30);
      --text-quaternary: rgba(60, 60, 67, 0.18);

      --separator: rgba(60, 60, 67, 0.29);
      --separator-opaque: #C6C6C8;

      --fill-primary: rgba(120, 120, 128, 0.20);
      --fill-secondary: rgba(120, 120, 128, 0.16);
      --fill-tertiary: rgba(118, 118, 128, 0.12);
      --fill-quaternary: rgba(116, 116, 128, 0.08);

      --accent: var(--apple-blue);
      --accent-hover: var(--apple-blue-hover);
      --danger: var(--apple-red);
      --danger-hover: var(--apple-red-hover);

      --tint-blue-bg: rgba(0, 122, 255, 0.12);
      --tint-blue-border: rgba(0, 122, 255, 0.30);
      --tint-blue-text: #007AFF;

      --tint-green-bg: rgba(52, 199, 89, 0.12);
      --tint-green-border: rgba(52, 199, 89, 0.30);
      --tint-green-text: #34C759;

      --tint-orange-bg: rgba(255, 149, 0, 0.12);
      --tint-orange-border: rgba(255, 149, 0, 0.30);
      --tint-orange-text: #FF9500;

      --tint-red-bg: rgba(255, 59, 48, 0.12);
      --tint-red-border: rgba(255, 59, 48, 0.30);
      --tint-red-text: #FF3B30;

      --tint-purple-bg: rgba(175, 82, 222, 0.12);
      --tint-purple-border: rgba(175, 82, 222, 0.30);
      --tint-purple-text: #AF52DE;

      --tint-teal-bg: rgba(48, 176, 199, 0.12);
      --tint-teal-border: rgba(48, 176, 199, 0.30);
      --tint-teal-text: #30B0C7;

      --tint-cyan-bg: rgba(50, 173, 230, 0.12);
      --tint-cyan-border: rgba(50, 173, 230, 0.30);
      --tint-cyan-text: #32ADE6;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        /* Apple HIG System Colors (Dark Mode) - https://developer.apple.com/design/human-interface-guidelines/color */
        --apple-blue: #0A84FF;
        --apple-blue-hover: #409CFF;
        --apple-purple: #BF5AF2;
        --apple-pink: #FF375F;
        --apple-red: #FF453A;
        --apple-red-hover: #FF6961;
        --apple-orange: #FF9F0A;
        --apple-yellow: #FFD60A;
        --apple-green: #30D158;
        --apple-mint: #63E6E2;
        --apple-teal: #40C8E0;
        --apple-cyan: #64D2FF;
        --apple-indigo: #5E5CE6;

        --apple-gray: #8E8E93;
        --apple-gray-2: #636366;
        --apple-gray-3: #48484A;
        --apple-gray-4: #3A3A3C;
        --apple-gray-5: #2C2C2E;
        --apple-gray-6: #1C1C1E;

        /* Apple HIG Semantic Tokens (Dark Mode) */
        --bg-primary: #000000;
        --bg-secondary: #1C1C1E;
        --bg-tertiary: #2C2C2E;
        --bg-grouped: #000000;
        --bg-card: #1C1C1E;

        --text-primary: #FFFFFF;
        --text-secondary: rgba(235, 235, 245, 0.60);
        --text-tertiary: rgba(235, 235, 245, 0.30);
        --text-quaternary: rgba(235, 235, 245, 0.16);

        --separator: rgba(84, 84, 88, 0.60);
        --separator-opaque: #38383A;

        --fill-primary: rgba(120, 120, 128, 0.36);
        --fill-secondary: rgba(120, 120, 128, 0.32);
        --fill-tertiary: rgba(118, 118, 128, 0.24);
        --fill-quaternary: rgba(118, 118, 128, 0.18);

        --accent: var(--apple-blue);
        --accent-hover: var(--apple-blue-hover);
        --danger: var(--apple-red);
        --danger-hover: var(--apple-red-hover);

        --tint-blue-bg: rgba(10, 132, 255, 0.15);
        --tint-blue-border: rgba(10, 132, 255, 0.35);
        --tint-blue-text: #0A84FF;

        --tint-green-bg: rgba(48, 209, 88, 0.15);
        --tint-green-border: rgba(48, 209, 88, 0.35);
        --tint-green-text: #30D158;

        --tint-orange-bg: rgba(255, 159, 10, 0.15);
        --tint-orange-border: rgba(255, 159, 10, 0.35);
        --tint-orange-text: #FF9F0A;

        --tint-red-bg: rgba(255, 69, 58, 0.15);
        --tint-red-border: rgba(255, 69, 58, 0.35);
        --tint-red-text: #FF453A;

        --tint-purple-bg: rgba(191, 90, 242, 0.15);
        --tint-purple-border: rgba(191, 90, 242, 0.35);
        --tint-purple-text: #BF5AF2;

        --tint-teal-bg: rgba(64, 200, 224, 0.15);
        --tint-teal-border: rgba(64, 200, 224, 0.35);
        --tint-teal-text: #40C8E0;

        --tint-cyan-bg: rgba(100, 210, 255, 0.15);
        --tint-cyan-border: rgba(100, 210, 255, 0.35);
        --tint-cyan-text: #64D2FF;
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      color: var(--text-primary);
      background: var(--bg-grouped);
      line-height: 1.5;
    }

    .page {
      max-width: 820px;
      margin: 0 auto;
      padding: 40px 24px 60px;
    }

    /* ── Header ── */
    .header-title-group {
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }
    .header-title-group img {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }
    .page-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 28px;
      gap: 16px;
    }

    .page-header h1 {
      font-size: 22px;
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    .page-header p {
      font-size: 13px;
      color: var(--text-secondary);
    }

    /* ── Progress ── */
    .progress-card {
      background: var(--bg-card);
      border: 1px solid var(--separator-opaque);
      border-radius: 8px;
      padding: 20px 24px;
      margin-bottom: 16px;
    }

    .progress-label {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 10px;
    }

    .progress-bar-track {
      height: 6px;
      background: var(--fill-quaternary);
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 3px;
      transition: width 0.3s ease;
      width: 0%;
    }

    /* ── Summary grid ── */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 10px;
      margin-bottom: 8px;
    }

    .summary-card {
      background: var(--bg-card);
      border: 2px solid var(--separator-opaque);
      border-radius: 8px;
      padding: 14px 12px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.15s;
      user-select: none;
    }

    .summary-card:hover {
      box-shadow: 0 1px 4px rgba(0,0,0,0.12);
    }

    .summary-card.active {
      border-color: var(--accent);
    }

    .summary-number {
      font-size: 26px;
      font-weight: 500;
      color: var(--text-primary);
      line-height: 1.1;
      margin-bottom: 4px;
    }

    .summary-label {
      font-size: 11px;
      color: var(--text-secondary);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .summary-card.active .summary-number { color: var(--accent); }

    .summary-card[data-filter="dead"] .summary-number,
    .summary-card[data-filter="dead"].active { color: var(--apple-red); }
    .summary-card[data-filter="dead"].active { border-color: var(--apple-red); }

    .summary-card[data-filter="domain_gone"] .summary-number,
    .summary-card[data-filter="domain_gone"].active { color: var(--apple-red); }
    .summary-card[data-filter="domain_gone"].active { border-color: var(--apple-red); }

    .summary-card[data-filter="redirect"] .summary-number { color: var(--apple-orange); }
    .summary-card[data-filter="redirect"].active { border-color: var(--apple-orange); color: var(--apple-orange); }

    .summary-card[data-filter="stale"] .summary-number { color: var(--apple-blue); }
    .summary-card[data-filter="stale"].active { border-color: var(--apple-blue); }

    .summary-card[data-filter="duplicates"] .summary-number { color: var(--apple-purple); }
    .summary-card[data-filter="duplicates"].active { border-color: var(--apple-purple); }

    .summary-card[data-filter="empty_folders"] .summary-number { color: var(--apple-gray); }
    .summary-card[data-filter="empty_folders"].active { border-color: var(--apple-gray); }

    .summary-card[data-filter="title_changed"] .summary-number { color: var(--apple-teal); }
    .summary-card[data-filter="title_changed"].active { border-color: var(--apple-teal); }

    .summary-card[data-filter="ok"] .summary-number { color: var(--apple-green); }
    .summary-card[data-filter="ok"].active { border-color: var(--apple-green); }

    .last-run {
      font-size: 12px;
      color: var(--text-tertiary);
      margin-top: 8px;
      margin-bottom: 20px;
    }

    /* ── Bulk actions ── */
    .bulk-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 0;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .bulk-bar-label {
      font-size: 12px;
      color: var(--text-secondary);
      margin-right: 4px;
    }

    /* ── Result cards ── */
    .result-card {
      background: var(--bg-card);
      border: 1px solid var(--separator-opaque);
      border-radius: 8px;
      margin-bottom: 10px;
      padding: 16px 20px;
      transition: border-color 0.15s;
    }

    .result-card.dismissed {
      opacity: 0.5;
    }

    .result-card.fixed {
      border-color: var(--apple-green);
    }

    .result-header {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 8px;
    }

    .result-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
      flex: 1;
      word-break: break-word;
    }

    .result-url {
      font-size: 12px;
      color: var(--accent);
      word-break: break-all;
      margin-bottom: 6px;
      text-decoration: none;
    }

    .result-url:hover { text-decoration: underline; }

    .result-meta {
      font-size: 12px;
      color: var(--text-tertiary);
      margin-bottom: 10px;
    }

    .result-new-url {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 10px;
    }

    .result-new-url strong { color: var(--text-primary); }

    .result-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    /* ── Status badges ── */
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 12px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .badge-dead       { background: var(--tint-red-bg); color: var(--tint-red-text); }
    .badge-domain_gone { background: var(--tint-red-bg); color: var(--tint-red-text); }
    .badge-redirect   { background: var(--tint-orange-bg); color: var(--tint-orange-text); }
    .badge-stale      { background: var(--tint-blue-bg); color: var(--tint-blue-text); }
    .badge-title_changed { background: var(--tint-teal-bg); color: var(--tint-teal-text); }
    .badge-ok         { background: var(--fill-quaternary); color: var(--text-secondary); }
    .badge-duplicate  { background: var(--tint-purple-bg); color: var(--tint-purple-text); }
    .badge-empty_folder { background: var(--fill-tertiary); color: var(--apple-gray); }
    .badge-fixed      { background: var(--tint-green-bg); color: var(--tint-green-text); }
    .badge-protected  { background: var(--tint-cyan-bg); color: var(--tint-cyan-text); }

    /* ── Buttons ── */
    .btn {
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      border: none;
      font-family: inherit;
    }

    .btn-primary {
      background: var(--accent);
      color: #ffffff;
    }

    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-secondary {
      background: var(--fill-quaternary);
      color: var(--text-primary);
      border: 1px solid var(--separator-opaque);
    }

    .btn-secondary:hover { background: var(--fill-tertiary); }

    .btn-danger {
      background: var(--tint-red-bg);
      color: var(--tint-red-text);
      border: 1px solid var(--tint-red-border);
    }

    .btn-danger:hover { background: var(--danger); color: #ffffff; }

    .btn-warn {
      background: var(--tint-orange-bg);
      color: var(--tint-orange-text);
      border: 1px solid var(--tint-orange-border);
    }

    .btn-warn:hover { background: var(--apple-orange); color: #ffffff; }

    .btn-sm {
      padding: 5px 12px;
      font-size: 12px;
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid transparent;
      padding: 5px 10px;
    }

    .btn-ghost:hover { color: var(--accent); border-color: var(--separator-opaque); }

    /* ── Cards (settings) ── */
    .card {
      background: var(--bg-card);
      border-radius: 8px;
      border: 1px solid var(--separator-opaque);
      margin-bottom: 16px;
    }

    .card-header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--separator-opaque);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
    }

    .card-body { padding: 24px; }

    .badge-opt {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 500;
      background: var(--tint-green-bg);
      color: var(--tint-green-text);
    }

    .form-group { margin-bottom: 20px; }
    .form-group:last-child { margin-bottom: 0; }
    .form-group-inline { margin-bottom: 16px; }

    .toggle-label {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
    }

    .toggle-label input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: var(--accent);
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .form-hint {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .interval-tabs {
      display: flex;
      border: 1px solid var(--separator-opaque);
      border-radius: 6px;
      overflow: hidden;
      width: fit-content;
    }

    .interval-tab {
      padding: 8px 20px;
      border: none;
      background: var(--bg-card);
      font-size: 13px;
      font-family: inherit;
      color: var(--text-secondary);
      cursor: pointer;
      font-weight: 500;
      transition: background 0.15s, color 0.15s;
    }

    .interval-tab:not(:last-child) { border-right: 1px solid var(--separator-opaque); }

    .interval-tab.active {
      background: var(--accent);
      color: #ffffff;
    }

    .interval-tab:not(.active):hover { background: var(--fill-quaternary); color: var(--text-primary); }

    .stale-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .stale-input {
      width: 100px;
      padding: 8px 12px;
      border: 1px solid var(--separator-opaque);
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      background: var(--bg-card);
      color: var(--text-primary);
    }

    .stale-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--tint-blue-border);
    }

    .stale-unit { font-size: 13px; color: var(--text-secondary); }

    .save-actions {
      display: flex;
      gap: 12px;
      margin-top: 20px;
      align-items: center;
    }

    .status-msg {
      font-size: 13px;
      padding: 8px 12px;
      border-radius: 6px;
      display: none;
    }

    .status-msg.visible { display: inline-block; }
    .status-msg.success { background: var(--tint-green-bg); color: var(--tint-green-text); border: 1px solid var(--tint-green-border); }
    .status-msg.error   { background: var(--tint-red-bg); color: var(--tint-red-text); border: 1px solid var(--tint-red-border); }

    /* ── Empty / no-results state ── */
    .empty-state {
      background: var(--bg-card);
      border: 1px solid var(--separator-opaque);
      border-radius: 8px;
      padding: 40px 24px;
      text-align: center;
      color: var(--text-secondary);
    }

    .empty-state .empty-icon {
      font-size: 40px;
      margin-bottom: 12px;
    }

    .empty-state p { font-size: 14px; }

    /* ── Back link ── */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--accent);
      text-decoration: none;
      font-size: 13px;
      margin-bottom: 24px;
    }

    .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="page">

    <a href="options.html" class="back-link">&#8592; Settings</a>

    <div class="page-header">
      <div class="header-title-group">
        <img src="icons/icon48.png" alt="AIJbookmarks">
        <div>
          <h1>Bookmark Health Check</h1>
          <p>Scan your bookmarks for dead links, redirects, stale content, and disappeared domains.</p>
        </div>
      </div>
      <button class="btn btn-primary" id="runBtn">Run Health Check</button>
    </div>

    <!-- Progress -->
    <div class="progress-card" id="progressSection" style="display:none">
      <div class="progress-label">
        Checking bookmarks&hellip; <span id="progressCurrent">0</span> / <span id="progressTotal">0</span>
      </div>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progressBarFill"></div>
      </div>
    </div>

    <!-- Summary -->
    <div class="summary-grid" id="summaryGrid">
      <div class="summary-card active" data-filter="dead">
        <div class="summary-number" id="sumDead">–</div>
        <div class="summary-label">Dead Links</div>
      </div>
      <div class="summary-card" data-filter="redirect">
        <div class="summary-number" id="sumRedirected">–</div>
        <div class="summary-label">Redirects</div>
      </div>
      <div class="summary-card" data-filter="stale">
        <div class="summary-number" id="sumStale">–</div>
        <div class="summary-label">Stale</div>
      </div>
      <div class="summary-card" data-filter="duplicates">
        <div class="summary-number" id="sumDuplicates">–</div>
        <div class="summary-label">Duplicates</div>
      </div>
      <div class="summary-card" data-filter="empty_folders">
        <div class="summary-number" id="sumEmptyFolders">–</div>
        <div class="summary-label">Empty Folders</div>
      </div>
      <div class="summary-card" data-filter="ok">
        <div class="summary-number" id="sumOk">–</div>
        <div class="summary-label">Healthy</div>
      </div>
    </div>

    <div class="last-run" id="lastRunLabel"></div>

    <!-- Bulk actions -->
    <div class="bulk-bar" id="bulkBar" style="display:none">
      <span class="bulk-bar-label">Bulk actions:</span>
      <button class="btn btn-sm btn-danger" id="bulkDeleteDead" style="display:none">Delete all dead</button>
      <button class="btn btn-sm btn-warn" id="bulkFixRedirects" style="display:none">Fix all redirects</button>
      <button class="btn btn-sm btn-secondary" id="bulkDismissStale" style="display:none">Dismiss all stale</button>
      <button class="btn btn-sm btn-danger" id="bulkDeleteStale" style="display:none">Delete all stale</button>
      <button class="btn btn-sm btn-danger" id="bulkDeleteDuplicates" style="display:none">Delete all duplicates</button>
      <button class="btn btn-sm btn-danger" id="bulkDeleteEmptyFolders" style="display:none">Delete all empty folders</button>
    </div>

    <!-- Results list -->
    <div id="resultsList"></div>

  </div>
  <script src="health-check.js"></script>
</body>
</html>
