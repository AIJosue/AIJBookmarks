<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIJbookmarks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 360px;
      font-family: 'Outfit', 'Segoe UI', Roboto, -apple-system, sans-serif;
      font-size: 13px;
      color: #202124;
      background: #fff;
    }

    /* Premium Header */
    .header {
      padding: 20px 16px 14px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .header-icon {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
    }

    .header-icon img {
      width: 36px;
      height: 36px;
      object-fit: cover;
      display: block;
    }

    .header-text h1 {
      font-size: 16px;
      font-weight: 600;
      color: #202124;
      letter-spacing: -0.2px;
    }

    .header-text p {
      font-size: 12px;
      color: #5f6368;
      margin-top: 1px;
    }

    /* Options Section with MD3 Switches */
    .options-section {
      padding: 6px 0;
      border-bottom: 1px solid #f1f3f4;
    }

    .option-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .option-row:hover {
      background: #f8f9fa;
    }

    .option-label {
      font-size: 13px;
      font-weight: 500;
      color: #3c4043;
    }

    .toggle {
      position: relative;
      width: 36px;
      height: 20px;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #e1e2e4;
      border-radius: 10px;
      transition: background-color 0.2s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.2s;
      border: 1px solid #74777f;
    }

    .toggle-slider:before {
      position: absolute;
      content: "";
      height: 12px;
      width: 12px;
      left: 3px;
      bottom: 3px;
      background: #74777f;
      border-radius: 50%;
      transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), width 0.15s, height 0.15s, background-color 0.2s;
    }

    .toggle input:checked + .toggle-slider {
      background: #1a73e8;
      border-color: #1a73e8;
    }

    .toggle input:checked + .toggle-slider:before {
      transform: translateX(16px);
      background: #fff;
      height: 14px;
      width: 14px;
      left: 2px;
      bottom: 2px;
    }

    /* Premium Pill Buttons */
    .actions {
      padding: 16px;
      display: flex;
      gap: 12px;
    }

    .btn {
      flex: 1;
      padding: 10px 24px;
      border-radius: 24px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
      border: none;
      font-family: inherit;
    }

    .btn:active:not(:disabled) {
      transform: scale(0.97);
    }

    .btn-primary {
      background: #1a73e8;
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      background: #1557b0;
      box-shadow: 0 2px 4px rgba(26, 115, 232, 0.25);
    }

    .btn-primary:disabled {
      background: #f1f3f4;
      color: #9aa0a6;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: #fff;
      color: #1a73e8;
      border: 1px solid #dadce0;
    }

    .btn-secondary:hover {
      background: #f8f9fa;
      border-color: #1a73e8;
    }

    /* Status Section */
    .status-section {
      padding: 0 16px 16px;
    }

    .status {
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-icon {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
    }

    .status.loading {
      background: #e8f0fe;
      color: #1967d2;
    }

    .status.loading .status-icon {
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .status.success {
      background: #e6f4ea;
      color: #137333;
    }

    .status.error {
      background: #fce8e6;
      color: #c5221f;
    }

    .status.warning {
      background: #fef7e0;
      color: #b05a00;
    }

    /* Premium Results Panels */
    .results-section {
      display: none;
      border-top: 1px solid #f1f3f4;
      background: #fafafa;
    }

    .results-section.visible {
      display: block;
    }

    .result-item {
      padding: 14px 16px;
      border-bottom: 1px solid #f1f3f4;
    }

    .result-item:last-child {
      border-bottom: none;
    }

    .result-label {
      font-size: 10px;
      font-weight: 600;
      color: #80868b;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 6px;
    }

    .result-value {
      font-size: 13px;
      color: #202124;
      line-height: 1.4;
    }

    .result-value.path {
      font-family: 'Roboto Mono', monospace;
      font-size: 11px;
      background: #e8f0fe;
      color: #1967d2;
      padding: 4px 10px;
      border-radius: 12px;
      display: inline-block;
      border: 1px solid rgba(25, 103, 210, 0.12);
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }

    .tag {
      background: #f1f3f4;
      color: #5f6368;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 500;
    }

    .integration-status {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .integration-status .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .integration-status .dot.success {
      background: #34a853;
    }

    .integration-status .dot.error {
      background: #ea4335;
    }

    /* Pipe-less Modern Navigation Footer */
    .footer {
      padding: 12px 16px;
      border-top: 1px solid #f1f3f4;
      display: flex;
      justify-content: space-around;
      background: #f8f9fa;
      align-items: center;
    }

    .footer a {
      color: #5f6368;
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      transition: color 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .footer a:hover {
      color: #1a73e8;
    }

    .settings-cog {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      transition: background-color 0.15s;
    }

    .settings-cog:hover {
      background-color: rgba(0, 0, 0, 0.05);
    }

    .cog-icon {
      width: 18px;
      height: 18px;
      fill: #5f6368;
      transition: fill 0.15s, transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .settings-cog:hover .cog-icon {
      fill: #1a73e8;
      transform: rotate(45deg);
    }

    /* Apple HIG Dark Mode Styles */
    @media (prefers-color-scheme: dark) {
      body {
        background: #1c1c1e;
        color: #ffffff;
      }

      .header-icon {
        background: linear-gradient(135deg, #0091ff, #007ae6);
        box-shadow: 0 2px 6px rgba(0, 145, 255, 0.35);
      }

      .header-text h1 {
        color: #ffffff;
      }

      .header-text p {
        color: #8e8e93;
      }

      .options-section {
        border-bottom-color: #383838;
      }

      .option-row:hover {
        background: #2c2c2e;
      }

      .option-label {
        color: #ffffff;
      }

      .toggle-slider {
        background: #3a3a3c;
      }

      .toggle-slider:before {
        background: #8e8e93;
      }

      .toggle input:checked + .toggle-slider {
        background: #30d158;
      }

      .toggle input:checked + .toggle-slider:before {
        background: #ffffff;
      }

      .btn-primary {
        background: #0091ff;
        color: #ffffff;
      }

      .btn-primary:not(:disabled):hover {
        background: #007ae6;
      }

      .btn-primary:disabled {
        background: #2c2c2e;
        color: #636366;
      }

      .btn-secondary {
        background: #3a3a3c;
        color: #0091ff;
        border-color: #383838;
      }

      .btn-secondary:hover {
        background: #444446;
        border-color: #3cd3fe;
        color: #3cd3fe;
      }

      .status.loading {
        background: rgba(0, 145, 255, 0.15);
        color: #3cd3fe;
        border: 1px solid rgba(0, 145, 255, 0.3);
      }

      .status.success {
        background: rgba(48, 209, 88, 0.15);
        color: #30d158;
        border: 1px solid rgba(48, 209, 88, 0.3);
      }

      .status.error {
        background: rgba(255, 66, 69, 0.15);
        color: #ff4245;
        border: 1px solid rgba(255, 66, 69, 0.3);
      }

      .status.warning {
        background: rgba(255, 159, 10, 0.15);
        color: #ff9f0a;
        border: 1px solid rgba(255, 159, 10, 0.3);
      }

      .results-section {
        border-top-color: #383838;
        background: #1e1e1e;
      }

      .result-item {
        border-bottom-color: #2c2c2e;
      }

      .result-label {
        color: #8e8e93;
      }

      .result-value {
        color: #ffffff;
      }

      .result-value.path {
        background: rgba(0, 145, 255, 0.15);
        color: #3cd3fe;
        border-color: rgba(0, 145, 255, 0.3);
      }

      .tag {
        background: #2c2c2e;
        color: #8e8e93;
        border: 1px solid #383838;
      }

      .footer {
        border-top-color: #383838;
        background: #1c1c1e;
      }

      .footer a {
        color: #8e8e93;
      }

      .footer a:hover {
        color: #0091ff;
      }

      .settings-cog:hover {
        background-color: #2c2c2e;
      }

      .cog-icon {
        fill: #8e8e93;
      }

      .settings-cog:hover .cog-icon {
        fill: #0091ff;
      }
    }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="header-icon">
      <img src="icons/icon48.png" alt="AIJbookmarks">
    </div>
    <div class="header-text">
      <h1>AIJbookmarks</h1>
      <p>AI-powered bookmark organizer</p>
    </div>
  </div>

  <!-- Options List with Material Switches -->
  <div class="options-section">
    <label class="option-row" for="autoBookmark">
      <span class="option-label">Auto-save to bookmarks</span>
      <div class="toggle">
        <input type="checkbox" id="autoBookmark" checked>
        <span class="toggle-slider"></span>
      </div>
    </label>
    <label class="option-row" id="saveToInstapaperRow" for="saveToInstapaper">
      <span class="option-label">Save to Instapaper (if article)</span>
      <div class="toggle">
        <input type="checkbox" id="saveToInstapaper">
        <span class="toggle-slider"></span>
      </div>
    </label>
    <label class="option-row" id="createTodoistRow" for="createTodoist">
      <span class="option-label">Create Todoist task</span>
      <div class="toggle">
        <input type="checkbox" id="createTodoist">
        <span class="toggle-slider"></span>
      </div>
    </label>
    <label class="option-row" id="createThingsRow" for="createThings">
      <span class="option-label">Add to Things</span>
      <div class="toggle">
        <input type="checkbox" id="createThings">
        <span class="toggle-slider"></span>
      </div>
    </label>
    <label class="option-row" id="saveToReadwiseRow" for="saveToReadwise">
      <span class="option-label">Save to Readwise</span>
      <div class="toggle">
        <input type="checkbox" id="saveToReadwise">
        <span class="toggle-slider"></span>
      </div>
    </label>
    <label class="option-row" id="saveToRaindropRow" for="saveToRaindrop">
      <span class="option-label">Save to Raindrop.io</span>
      <div class="toggle">
        <input type="checkbox" id="saveToRaindrop">
        <span class="toggle-slider"></span>
      </div>
    </label>
  </div>

  <!-- Action Buttons -->
  <div class="actions">
    <button class="btn btn-primary" id="analyzeBtn">Analyze & Save</button>
  </div>

  <!-- Status Alert Area -->
  <div class="status-section" id="statusContainer"></div>

  <!-- AI Results Card -->
  <div class="results-section" id="results">
    <div class="result-item" id="matchedCategoryContainer">
      <div class="result-label">Saved to</div>
      <div class="result-value path" id="matchedCategory"></div>
    </div>

    <div class="result-item">
      <div class="result-label">Title</div>
      <div class="result-value" id="resultTitle"></div>
    </div>

    <div class="result-item">
      <div class="result-label">Summary</div>
      <div class="result-value" id="resultSummary"></div>
    </div>

    <div class="result-item">
      <div class="result-label">Type</div>
      <div class="result-value" id="contentType"></div>
    </div>

    <div class="result-item" id="categoriesContainer">
      <div class="result-label">Tags</div>
      <div class="tags" id="categories"></div>
    </div>

    <div class="result-item" id="instapaperContainer" style="display: none;">
      <div class="result-label">Instapaper</div>
      <div class="result-value integration-status" id="instapaperStatus"></div>
    </div>

    <div class="result-item" id="todoistContainer" style="display: none;">
      <div class="result-label">Todoist</div>
      <div class="result-value integration-status" id="todoistStatus"></div>
    </div>

    <div class="result-item" id="thingsContainer" style="display: none;">
      <div class="result-label">Things</div>
      <div class="result-value integration-status" id="thingsStatus"></div>
    </div>

    <div class="result-item" id="readwiseContainer" style="display: none;">
      <div class="result-label">Readwise</div>
      <div class="result-value integration-status" id="readwiseStatus"></div>
    </div>

    <div class="result-item" id="raindropContainer" style="display: none;">
      <div class="result-label">Raindrop.io</div>
      <div class="result-value integration-status" id="raindropStatus"></div>
    </div>
  </div>

  <!-- Nav Footer Bar (Pipe-less) -->
  <div class="footer">
    <a href="#" id="inboxLink">To Sort</a>
    <a href="#" id="healthCheckLink">Health Check</a>
    <a href="#" id="settingsLink" class="settings-cog" title="Settings">
      <svg class="cog-icon" viewBox="0 0 24 24">
        <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
      </svg>
    </a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
