name: edge_embedding
description: On-device EmbeddingGemma-2 Native Host for AIJBookmarks using flutter_edge_ai and flutter_edge_ai_llama.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter_edge_ai: ^2.5.2
  flutter_edge_ai_llama: ^0.0.3

hooks:
  user_defines:
    llamadart:
      llamadart_native_runtimes: llama_cpp
